[project]
name = "lingo-music-downloader-legacy"
version = "2.1.1b1"
description = "LingoMusicDownloader legacy backend API and downloader service"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "gamdl==3.5.2",
    "pydantic>=2.6.3",
    "pydantic-settings>=2.2.1",
    "httpx>=0.28.1",
    "httpx-retries>=0.6.0",
    "m3u8>=6.0.0",
    "mutagen>=1.48.1",
    "pillow>=13.0.0",
    "pycryptodome>=3.24.1",
    "yt-dlp>=2026.3.17",
]

[tool.uv]
package = false
